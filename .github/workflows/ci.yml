name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop-and-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Full dependency security audit
        run: npm audit --audit-level=high

      - name: Runtime dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Ensure Electron runtime
        shell: pwsh
        run: |
          $installScript = Join-Path $PWD "node_modules/electron/install.js"
          if (-not (Test-Path -LiteralPath $installScript)) {
            $installScript = Join-Path $PWD "apps/desktop/node_modules/electron/install.js"
          }
          if (-not (Test-Path -LiteralPath $installScript)) {
            throw "Electron install script not found: $installScript"
          }
          node $installScript

      - name: Run JavaScript tests
        run: npm test

      - name: Question detection benchmark
        run: npm run benchmark:question

      - name: Interview soak test
        run: npm run test:soak

      - name: Typecheck
        run: npm run typecheck

      - name: Build desktop
        run: npm run build

      - name: Build independent capture helper
        run: npm run capture-helper:build

      - name: Rust format check for capture helper
        run: cargo fmt --check --manifest-path tools/capture-helper/Cargo.toml

      - name: External capture protection smoke
        run: npm run capture-protection:smoke

      - name: Upload capture protection v2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-protection-v2-${{ github.run_id }}
          path: artifacts/capture-protection-v2
          if-no-files-found: ignore

      - name: Production renderer smoke test
        run: node apps/desktop/scripts/production-smoke.mjs

      - name: Mock Provider Electron functional E2E
        shell: pwsh
        run: npm run functional:e2e

      - name: Probe failure Electron E2E
        shell: pwsh
        run: npm run probe-failure:e2e

      - name: Shutdown process Electron E2E
        shell: pwsh
        run: npm run shutdown-process:e2e

      - name: Rust format check
        run: cargo fmt --check --manifest-path crates/audio-sidecar/Cargo.toml

      - name: Rust tests
        shell: pwsh
        run: |
          cargo test --manifest-path crates/audio-sidecar/Cargo.toml 2>&1 | Tee-Object rust-test.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content rust-test.log | Select-Object -Last 20 | ForEach-Object { Write-Output ("::error title=Rust test::" + $_) }
            exit $LASTEXITCODE
          }

      - name: Upload Rust test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-log-${{ github.run_id }}
          path: rust-test.log
          if-no-files-found: ignore

      - name: Rust check
        run: cargo check --manifest-path crates/audio-sidecar/Cargo.toml

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Ensure Electron runtime
        shell: pwsh
        run: |
          $installScript = Join-Path $PWD "node_modules/electron/install.js"
          if (-not (Test-Path -LiteralPath $installScript)) {
            $installScript = Join-Path $PWD "apps/desktop/node_modules/electron/install.js"
          }
          if (-not (Test-Path -LiteralPath $installScript)) {
            throw "Electron install script not found: $installScript"
          }
          node $installScript

      - name: Build NSIS installer
        shell: pwsh
        run: |
          npm run package:win 2>&1 | Tee-Object package-windows.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content package-windows.log | Select-Object -Last 20 | ForEach-Object { Write-Output ("::error title=Windows package::" + $_) }
            exit $LASTEXITCODE
          }

      - name: Verify packaged runtime content
        shell: pwsh
        run: |
          node apps/desktop/scripts/verify-package.mjs

      - name: Packaged external capture protection smoke
        shell: pwsh
        run: |
          $unpacked = Join-Path $PWD "apps/desktop/release/win-unpacked"
          $electron = Join-Path $unpacked "Interview Copilot.exe"
          $env:ELECTRON_EXECUTABLE = $electron
          $env:ELECTRON_PACKAGED = "true"
          npm run capture-protection:smoke

      - name: Upload packaged capture protection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-protection-v2-packaged-${{ github.run_id }}
          path: artifacts/capture-protection-v2
          if-no-files-found: ignore

      - name: Packaged renderer smoke test
        shell: pwsh
        run: |
          $unpacked = Join-Path $PWD "apps/desktop/release/win-unpacked"
          $electron = Join-Path $unpacked "Interview Copilot.exe"
          if (-not (Test-Path -LiteralPath $electron)) {
            Write-Error "Packaged Electron executable not found: $electron"
            exit 1
          }
          $env:ELECTRON_EXECUTABLE = $electron
          $env:ELECTRON_PACKAGED = "true"
          node apps/desktop/scripts/production-smoke.mjs

      - name: Upload packaging log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-windows-log-${{ github.run_id }}
          path: package-windows.log
          if-no-files-found: ignore

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: InterviewCopilot-windows-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
