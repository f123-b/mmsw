name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop-and-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Run JavaScript tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build desktop
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path crates/audio-sidecar/Cargo.toml

      - name: Rust check
        run: cargo check --manifest-path crates/audio-sidecar/Cargo.toml

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run package:win

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: InterviewCopilot-Windows-Installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
