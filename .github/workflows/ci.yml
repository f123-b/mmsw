name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop-and-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Run JavaScript tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build desktop
        run: npm run build

      - name: Rust format check
        run: cargo fmt --check --manifest-path crates/audio-sidecar/Cargo.toml

      - name: Rust tests
        shell: pwsh
        run: |
          cargo test --manifest-path crates/audio-sidecar/Cargo.toml 2>&1 | Tee-Object rust-test.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content rust-test.log | Select-Object -Last 20 | ForEach-Object { Write-Output ("::error title=Rust test::" + $_) }
            exit $LASTEXITCODE
          }

      - name: Upload Rust test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-log-${{ github.run_id }}
          path: rust-test.log
          if-no-files-found: ignore

      - name: Rust check
        run: cargo check --manifest-path crates/audio-sidecar/Cargo.toml

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build NSIS installer
        shell: pwsh
        run: |
          npm run package:win 2>&1 | Tee-Object package-windows.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content package-windows.log | Select-Object -Last 20 | ForEach-Object { Write-Output ("::error title=Windows package::" + $_) }
            exit $LASTEXITCODE
          }

      - name: Verify packaged runtime content
        shell: pwsh
        run: |
          $unpacked = Join-Path $PWD "apps/desktop/release/win-unpacked"
          $required = @(
            (Join-Path $unpacked "resources/audio-sidecar/interview-audio.exe"),
            (Join-Path $unpacked "resources/sql.js/sql-wasm.wasm")
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              Write-Error "Missing packaged runtime dependency: $path"
              exit 1
            }
          }
          Write-Output "Verified packaged runtime dependencies: $($required -join ', ')"

      - name: Upload packaging log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-windows-log-${{ github.run_id }}
          path: package-windows.log
          if-no-files-found: ignore

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: InterviewCopilot-Windows-Installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
