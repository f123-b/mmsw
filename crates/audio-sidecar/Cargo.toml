[package]
name = "interview-audio"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Windows-first dual-channel microphone and WASAPI loopback audio sidecar"
license = "MIT"

[dependencies]
cpal = "0.18.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
